# Editable campaigns and areas for FIRE-SALE.
# The owner is selling two of their own services. Change the offer text,
# the pitch, or the service area here. Python does not contain a category list.
#
# A default run uses default_areas and default_campaign.
# Override either one from the CLI or the environment for a single run.

default_campaign = "contracting_tree_removal"
default_areas = ["brampton", "prince_edward_county"]

[region]
name = "Ontario service areas"
# Used when a one-off city is not listed under region.places.
geocode_suffix = "Ontario, Canada"
# Used only when a run asks for cities and does not name an area.
default_cities = ["Brampton"]

[region.places]
Brampton = "Brampton, Ontario, Canada"
Mississauga = "Mississauga, Ontario, Canada"
Toronto = "Toronto, Ontario, Canada"
Vaughan = "Vaughan, Ontario, Canada"
Markham = "Markham, Ontario, Canada"
Oakville = "Oakville, Ontario, Canada"
Picton = "Picton, Ontario, Canada"
Wellington = "Wellington, Ontario, Canada"
Bloomfield = "Bloomfield, Ontario, Canada"
Consecon = "Consecon, Ontario, Canada"
Milford = "Milford, Ontario, Canada"
Rossmore = "Rossmore, Ontario, Canada"

# Named areas. Either campaign can use either area.
# bbox is south, west, north, east. It is the Overpass search window.
# config/areas/<key>.geojson is the municipal polygon. A hit inside the box
# is kept only when it is also inside that polygon, so Georgetown, Norval
# proper, and Trenton are not treated as part of the service area.
# Source: Nominatim relation 3776364 (county) and relation 2407358 (Brampton).

[areas.brampton]
name = "Brampton"
place_query = "Brampton, Ontario, Canada"
bbox = [43.6018018, -79.8888473, 43.8480959, -79.6302939]

[areas.prince_edward_county]
name = "Prince Edward County"
place_query = "Prince Edward County, Ontario, Canada"
bbox = [43.7981717, -77.6279279, 44.1855154, -76.4997494]

[run]
max_leads = 20
provider = "osm"
find_emails = true
request_delay_seconds = 1.1

# Chains and franchises are dropped for every campaign.
# drop_branded also drops a place OSM tagged with brand or brand:wikidata.
# Off-target places are dropped before a lead is stored, scored, or emailed.
# To change what gets dropped, edit a list under [[filters.off_target]]
# (every campaign) or [[campaigns.<name>.off_target]] (that campaign only).
# Each block has a reason, OSM tags (key=value), and name keywords.
# exclude_keywords on a campaign is also applied as the competitor reason.
# check_mx clears an address when a lookup proves it cannot receive mail.
# A lookup failure keeps the address. Leave check_mx false unless you want it.
[filters]
drop_branded = true
check_mx = false
chain_names = [
  "tim hortons", "timhortons", "mcdonalds", "starbucks", "subway", "burger king",
  "wendys", "kfc", "popeyes", "pizza pizza", "pizza hut", "domino", "dairy queen",
  "harveys", "mary brown", "a&w", "swiss chalet", "boston pizza", "taco bell",
  "chipotle", "five guys", "second cup", "coffee time", "country style",
  "shoppers drug mart", "walmart", "canadian tire", "home depot", "rona",
  "home hardware", "lcbo", "the beer store", "circle k", "couche-tard",
  "esso", "petro-canada", "shell", "re/max", "remax", "royal lepage",
  "century 21", "keller williams", "coldwell banker", "sothebys", "exp realty",
  "homelife", "colliers", "cbre", "hilton", "marriott", "holiday inn",
  "best western", "super 8", "comfort inn", "motel 6", "hampton inn", "days inn",
  "goodlife", "planet fitness", "anytime fitness", "h&r block", "liberty tax",
  "molly maid", "merry maids", "great clips", "sport clips", "rexall",
  "ikea", "costco", "loblaws", "no frills", "food basics", "freshco", "sobeys",
  "giant tiger", "dollarama", "sutton group", "sutton", "exit realty",
  "country inn", "radisson", "sheraton", "wyndham", "quality inn", "ramada",
  "hyatt", "fairmont", "delta hotels", "travelodge", "knights inn", "la quinta",
  "embassy suites", "homewood", "microtel", "econo lodge", "red roof",
]

[[filters.off_target]]
reason = "government"
tags = [
  "office=government", "amenity=townhall", "amenity=courthouse", "amenity=police",
  "amenity=fire_station", "amenity=library", "amenity=post_office",
]
keywords = [
  "service ontario", "serviceontario", "canada post", "city hall", "town hall",
  "municipal office", "courthouse", "court house", "police station", "police service",
  "fire station", "fire hall", "fire department", "public library", "library",
  "post office",
]

[[filters.off_target]]
reason = "school"
tags = [
  "amenity=school", "amenity=university", "amenity=college", "amenity=kindergarten",
  "building=school",
]
keywords = [
  "school", "university", "college", "high school", "public school",
  "elementary school", "secondary school", "school board",
]

[[filters.off_target]]
reason = "worship"
tags = [
  "amenity=place_of_worship", "building=church", "building=mosque",
  "building=synagogue", "building=temple", "building=chapel", "building=cathedral",
]
keywords = ["church", "mosque", "synagogue", "temple", "chapel", "parish", "gurdwara", "cathedral"]

[[filters.off_target]]
reason = "hospital"
tags = ["amenity=hospital", "amenity=clinic", "amenity=doctors"]
keywords = ["hospital", "medical clinic", "walk-in clinic", "walk in clinic", "health centre", "health center"]

[[filters.off_target]]
reason = "association"
tags = []
keywords = ["board of trade", "chamber of commerce", "chamber", "business improvement area", "bia"]

[[filters.off_target]]
reason = "charity"
tags = ["office=ngo", "office=charity"]
keywords = ["charity", "non-profit", "nonprofit", "not-for-profit", "not for profit"]

[[filters.off_target]]
reason = "bank"
tags = ["amenity=bank", "amenity=atm"]
keywords = ["bank", "atm", "credit union"]

[[filters.off_target]]
reason = "gas_station"
tags = ["amenity=fuel"]
keywords = ["gas station", "gas bar", "petrol station"]

[[filters.off_target]]
reason = "parking"
tags = ["amenity=parking"]
keywords = ["parking lot", "parking garage"]

[[filters.off_target]]
reason = "bus_stop"
tags = ["highway=bus_stop", "amenity=bus_station", "public_transport=platform"]
keywords = ["bus stop", "bus station"]

# Campaign A. Buyers of contracting and tree removal, not other tree companies.
[campaigns.contracting_tree_removal]
description = "Organizations with grounds or a site that buy contracting and tree removal."
offer = "Contracting and tree removal for properties that need the work done on site: hazard trees, storm cleanup, lot clearing, and general contracting."
sender_pitch = "We run a contracting and tree removal crew. We take down hazard trees, clear lots after storms, and do the site work that property managers, clubs, and landowners would rather not staff themselves."
service_area = "Brampton and Prince Edward County, Ontario"
prioritize_missing_website = false
exclude_keywords = [
  "tree service", "tree removal", "arborist", "stump grinding", "tree care",
  "landscaping", "landscaper", "landscape contractor", "general contractor",
  "contractor", "contracting",
]
scoring_notes = """
- Owns or manages land, buildings, or grounds in the service area
- Strong fits include property managers, condo boards, landlords, real estate offices, builders, golf courses, campgrounds, cottage and resort rentals, wineries, farms, orchards, cemeteries, and marinas
- A phone number or a street address is enough. A website is optional
- Poor fits: a tree service, landscaper, or contractor; a national chain; a government or municipal office; a school; a place of worship; a hospital; a chamber, board of trade, or BIA; a charity; a bank, gas station, parking lot, or bus stop
"""

[[campaigns.contracting_tree_removal.off_target]]
reason = "competitor"
tags = ["craft=gardener"]
keywords = ["landscaping", "landscaper", "contractor", "contracting"]

[[campaigns.contracting_tree_removal.targets]]
label = "property management or condo office"
keywords = ["property management", "condominium", "condo corporation"]

[[campaigns.contracting_tree_removal.targets]]
label = "real estate office"
tags = ["office=estate_agent"]

[[campaigns.contracting_tree_removal.targets]]
label = "builder or developer"
keywords = ["home builder", "custom homes", "property developer"]
tags = ["craft=builder"]

[[campaigns.contracting_tree_removal.targets]]
label = "golf course"
tags = ["leisure=golf_course"]

[[campaigns.contracting_tree_removal.targets]]
label = "campground"
tags = ["tourism=camp_site", "tourism=caravan_site"]

[[campaigns.contracting_tree_removal.targets]]
label = "cottage or resort rental"
tags = ["tourism=guest_house", "tourism=chalet", "tourism=hotel", "tourism=motel"]

[[campaigns.contracting_tree_removal.targets]]
label = "winery, farm, or orchard"
tags = ["craft=winery", "landuse=vineyard", "landuse=orchard", "shop=farm", "landuse=farmyard"]

[[campaigns.contracting_tree_removal.targets]]
label = "cemetery"
tags = ["landuse=cemetery", "amenity=grave_yard"]

[[campaigns.contracting_tree_removal.targets]]
label = "marina"
tags = ["leisure=marina"]

[[campaigns.contracting_tree_removal.targets]]
label = "association or condo board"
tags = ["office=association"]

# Campaign B. Website design for independent local businesses.
# Missing OSM website tags are preferred. Phone and address are kept either way.
[campaigns.web_design]
description = "Independent local businesses, preferring those with no website in OpenStreetMap."
offer = "Website design for independent local businesses that have no real website, or only a thin social or free-builder page."
sender_pitch = "I design straightforward websites for local businesses. Most of the owners I talk to are still sending customers to a Facebook page, or they have no site at all."
service_area = "Brampton and Prince Edward County, Ontario"
prioritize_missing_website = true
exclude_keywords = [
  "web design", "website design", "web developer", "seo agency",
  "marketing agency", "digital agency", "web agency", "advertising agency",
]
weak_website_hosts = [
  "facebook.com", "instagram.com", "fb.com", "fb.me", "linktr.ee", "linktree.com",
  "wixsite.com", "wix.com", "square.site", "godaddysites.com", "sites.google.com",
  "business.site", "wordpress.com", "weebly.com", "blogspot.com",
  "yelp.com", "yelp.ca", "yellowpages.ca", "tripadvisor.com", "tripadvisor.ca",
]
scoring_notes = """
- Independent local business in any trade or storefront
- No website, or only a weak one (a social page, a link-in-bio, or a free subdomain), is a strong positive signal
- A phone number and a street address are enough when email is missing
- Poor fits: a national chain or franchise, a web or marketing agency, a government office, a school, a place of worship, a hospital, a chamber or board of trade, a charity, a bank, or a gas station
"""

[[campaigns.web_design.off_target]]
reason = "competitor"
tags = ["office=advertising_agency"]
keywords = ["web design", "marketing agency", "digital agency"]

[[campaigns.web_design.targets]]
label = "hair or beauty salon"
tags = ["shop=hairdresser", "shop=beauty"]

[[campaigns.web_design.targets]]
label = "florist"
tags = ["shop=florist"]

[[campaigns.web_design.targets]]
label = "bakery or butcher"
tags = ["shop=bakery", "shop=butcher"]

[[campaigns.web_design.targets]]
label = "auto repair shop"
tags = ["shop=car_repair"]

[[campaigns.web_design.targets]]
label = "clothing or hardware shop"
tags = ["shop=clothes", "shop=hardware"]

[[campaigns.web_design.targets]]
label = "accountant"
tags = ["office=accountant"]

[[campaigns.web_design.targets]]
label = "law firm"
tags = ["office=lawyer"]

[[campaigns.web_design.targets]]
label = "insurance office"
tags = ["office=insurance"]

[[campaigns.web_design.targets]]
label = "dental office"
tags = ["amenity=dentist"]

[[campaigns.web_design.targets]]
label = "veterinary clinic"
tags = ["amenity=veterinary"]

[[campaigns.web_design.targets]]
label = "restaurant or cafe"
tags = ["amenity=restaurant", "amenity=cafe", "amenity=bar"]

[[campaigns.web_design.targets]]
label = "home trade"
tags = ["craft=electrician", "craft=plumber", "craft=hvac", "craft=carpenter", "craft=painter"]

[[campaigns.web_design.targets]]
