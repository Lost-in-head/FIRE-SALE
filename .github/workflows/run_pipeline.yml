name: Run FIRE-SALE Pipeline

on:
  # Tests run on every push and pull request. The live pipeline does not.
  push:
  pull_request:

  # Run the full pipeline every day at 08:00 UTC
  schedule:
    - cron: "0 8 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to run (leave empty for full pipeline)"
        required: false
        type: choice
        options:
          - ""
          - prospector
          - lead_gen
          - outreach
          - replies
          - followup
          - closer
      dry_run:
        description: "Dry run (no emails sent, no DB writes)"
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  run-pipeline:
    # Live Nominatim/Overpass plus email sending. Not part of pull-request CI.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the newest saved database. The exact key includes this run id,
      # so it misses, and the prefix matches fire-sale-db-<os>-<previous run id>.
      # An older exact key fire-sale-db-<os> (with no run id) is not a match.
      - name: Restore lead database from cache
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: data/fire_sale_leads.sqlite3
          key: fire-sale-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fire-sale-db-${{ runner.os }}-

      - name: Run Director Agent
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY:         ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER:        ${{ vars.LLM_PROVIDER }}
          LLM_MODEL:           ${{ vars.LLM_MODEL }}
          LLM_BASE_URL:        ${{ vars.LLM_BASE_URL }}
          EMAIL_ADDRESS:       ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD:  ${{ secrets.EMAIL_APP_PASSWORD }}
          SENDER_NAME:         ${{ secrets.SENDER_NAME }}
          BOOKING_LINK:        ${{ secrets.BOOKING_LINK }}
          SMTP_HOST:           ${{ vars.SMTP_HOST }}
          SMTP_PORT:           ${{ vars.SMTP_PORT || '587' }}
          SMTP_STARTTLS:       ${{ vars.SMTP_STARTTLS || 'true' }}
          TEST_MODE:           ${{ vars.TEST_MODE }}
          TEST_RECIPIENT:      ${{ secrets.TEST_RECIPIENT }}
          IMAP_HOST:           ${{ vars.IMAP_HOST }}
          IMAP_PORT:           ${{ vars.IMAP_PORT || '993' }}
          IMAP_SSL:            ${{ vars.IMAP_SSL || 'true' }}
          IMAP_USER:           ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD:       ${{ secrets.IMAP_PASSWORD }}
          SCORE_DEAD_THRESHOLD: ${{ vars.SCORE_DEAD_THRESHOLD || '4' }}
          DRY_RUN:             ${{ inputs.dry_run || 'false' }}
          # Blank prospector values fall through to config/prospecting.toml.
          PROSPECTOR_AREAS:         ${{ vars.PROSPECTOR_AREAS }}
          PROSPECTOR_CITIES:        ${{ vars.PROSPECTOR_CITIES }}
          PROSPECTOR_CAMPAIGN:      ${{ vars.PROSPECTOR_CAMPAIGN }}
          PROSPECTOR_QUERIES:       ${{ vars.PROSPECTOR_QUERIES }}
          PROSPECTOR_TAGS:          ${{ vars.PROSPECTOR_TAGS }}
          PROSPECTOR_MAX_LEADS:     ${{ vars.PROSPECTOR_MAX_LEADS }}
          PROSPECTOR_PROVIDER:      ${{ vars.PROSPECTOR_PROVIDER }}
          PROSPECTOR_FIND_EMAILS:   ${{ vars.PROSPECTOR_FIND_EMAILS }}
          PROSPECTOR_CONTACT_EMAIL: ${{ vars.PROSPECTOR_CONTACT_EMAIL }}
        run: |
          mode=$(printf '%s' "${TEST_MODE:-}" | tr '[:upper:]' '[:lower:]')
          case "$mode" in
            false|0|off|no)
              export TEST_MODE=false
              echo "TEST_MODE is explicitly off. Prospects can be emailed when SMTP is configured."
              if [ -z "${EMAIL_ADDRESS}" ] || [ -z "${EMAIL_APP_PASSWORD}" ] || [ -z "${SMTP_HOST}" ]; then
                echo "::warning::TEST_MODE is off but email settings are incomplete. Email stages will skip."
              fi
              ;;
            *)
              export TEST_MODE=true
              echo "::notice::TEST_MODE is on. Outbound email is redirected to TEST_RECIPIENT and is not sent to prospects."
              if [ -z "${TEST_RECIPIENT}" ]; then
                echo "::warning::TEST_MODE is on but TEST_RECIPIENT is empty. Email stages will refuse to send."
              fi
              ;;
          esac
          provider=$(printf '%s' "${LLM_PROVIDER:-anthropic}" | tr '[:upper:]' '[:lower:]')
          llm_key="${LLM_API_KEY:-}"
          if [ -z "$llm_key" ] && [ "$provider" = "anthropic" ]; then
            llm_key="${ANTHROPIC_API_KEY:-}"
          fi
          if [ -z "$llm_key" ]; then
            echo "::warning::No LLM API key is set. Scoring and copy stages will skip. Set LLM_API_KEY, or ANTHROPIC_API_KEY when the provider is anthropic."
          fi
          unset llm_key
          STAGE_ARG=""
          if [ -n "${{ inputs.stage }}" ]; then
            STAGE_ARG="--stage ${{ inputs.stage }}"
          fi
          DRY_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python backend/agents/director_agent.py $STAGE_ARG $DRY_ARG

      - name: Checkpoint lead database
        if: always()
        run: |
          if [ -f data/fire_sale_leads.sqlite3 ]; then
            python -c "import sqlite3; c=sqlite3.connect('data/fire_sale_leads.sqlite3'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          fi

      - name: Save lead database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/fire_sale_leads.sqlite3
          key: fire-sale-db-${{ runner.os }}-${{ github.run_id }}
